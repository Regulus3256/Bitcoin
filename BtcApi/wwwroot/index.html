<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BTC/USD Realtime Candlestick Chart</title>
    <!-- 外部ライブラリ -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- 自作CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>BTC/USD Realtime Candlestick Chart</h1>

    <div class="toolbar" aria-label="Timeframe selector">
        <button class="timeframe-btn" data-range="1m">1分足</button>
        <button class="timeframe-btn active" data-range="1h">1時間足</button>
        <button class="timeframe-btn" data-range="4h">4時間足</button>
        <button class="timeframe-btn" data-range="1d">日足</button>
        <button class="timeframe-btn" data-range="1w">週足</button>
    </div>

    <div class="chart-layout">
        <div id="chart"></div>
        <aside id="candle-detail" class="candle-detail">
            <div class="detail-grid">
                <div class="detail-item"><span>始値</span><strong id="detail-open">-</strong></div>
                <div class="detail-item"><span>高値</span><strong id="detail-high">-</strong></div>
                <div class="detail-item"><span>低値</span><strong id="detail-low">-</strong></div>
                <div class="detail-item"><span>終値</span><strong id="detail-close">-</strong></div>
            </div>
        </aside>
    </div>
    <div id="status" class="status">Connecting...</div>

    <!-- 自作JavaScript（依存関係の順に読み込む） -->
    <script src="js/api.js"></script>
    <script src="js/aggregator.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
