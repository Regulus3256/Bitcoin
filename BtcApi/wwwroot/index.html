<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BTC/USD Realtime Candlestick Chart</title>
    <!-- 外部ライブラリ -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- 自作CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="page-header">
        <div class="title-tools">
            <h1>BTC/USD Realtime Candlestick Chart</h1>
            <button id="tools-toggle" class="tools-toggle" type="button" aria-label="チャートツール" aria-expanded="false" aria-controls="tools-dialog" title="チャートツール">
                <span></span><span></span><span></span>
            </button>
        </div>
        <aside id="candle-detail" class="candle-detail">
            <div class="detail-grid">
                <div class="detail-item"><span>始値</span><strong id="detail-open">-</strong></div>
                <div class="detail-item"><span>高値</span><strong id="detail-high">-</strong></div>
                <div class="detail-item"><span>低値</span><strong id="detail-low">-</strong></div>
                <div class="detail-item"><span>終値</span><strong id="detail-close">-</strong></div>
            </div>
        </aside>
    </header>

    <dialog id="tools-dialog" class="tools-dialog" aria-labelledby="tools-title">
        <div class="dialog-header">
            <h2 id="tools-title">チャートツール</h2>
            <button id="tools-close" class="dialog-close" type="button" aria-label="閉じる" title="閉じる">×</button>
        </div>
        <section class="dialog-section">
            <h3>インジケーター</h3>
            <label class="tool-option"><input type="checkbox" data-sma="10"><span class="sma-swatch sma-10"></span><span>SMA 10</span></label>
            <label class="tool-option"><input type="checkbox" data-sma="50"><span class="sma-swatch sma-50"></span><span>SMA 50</span></label>
            <label class="tool-option"><input type="checkbox" data-sma="100"><span class="sma-swatch sma-100"></span><span>SMA 100</span></label>
            <label class="tool-option"><input type="checkbox" data-sma="200"><span class="sma-swatch sma-200"></span><span>SMA 200</span></label>
        </section>
        <section class="dialog-section">
            <h3>描画ツール</h3>
            <button id="fib-tool" class="fib-tool-button" type="button" aria-pressed="false">
                <span class="fib-tool-icon" aria-hidden="true"><i></i><i></i><i></i><b></b></span>
                <span>フィボナッチ</span>
            </button>
            <button id="fib-clear" class="menu-action secondary" type="button">フィボナッチを消去</button>
        </section>
    </dialog>

    <div class="toolbar" aria-label="Timeframe selector">
        <button class="timeframe-btn" data-range="1m">1分足</button>
        <button class="timeframe-btn active" data-range="1h">1時間足</button>
        <button class="timeframe-btn" data-range="4h">4時間足</button>
        <button class="timeframe-btn" data-range="1d">日足</button>
        <button class="timeframe-btn" data-range="1w">週足</button>
    </div>

    <div class="chart-layout">
        <div id="chart"></div>
    </div>
    <div id="status" class="status">Connecting...</div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
