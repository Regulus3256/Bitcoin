version: '3.8'

services:
  # 1. API層（ASP.NET Core）
  api:
    build: ./BtcApi
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__MarketData=Host=db;Port=5432;Database=btcdb;Username=postgres;Password=NiV9eK6AJPf2okDR5dtcxGTjv6kRFm1b
      - HistoricalData__StartDate=2023-01-01
    depends_on:
      db:
        condition: service_healthy

  # 2. DB層（PostgreSQL）
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: btcdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NiV9eK6AJPf2okDR5dtcxGTjv6kRFm1b
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btcdb"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: